# Render Blueprint: Postgres + Dockerised API + static client, all on free instance types.
# Dashboard: New > Blueprint > connect this repo > Deploy Blueprint.
databases:
  - name: taskflow-db
    plan: free
    region: frankfurt
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: 'true'
      # Render's load balancer sits in front of the service.
      - key: TRUST_PROXY
        value: '1'
      - key: CORS_ORIGIN
        value: https://taskflow-web.onrender.com

  - type: web
    name: taskflow-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://taskflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
