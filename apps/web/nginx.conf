server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The browser talks to one origin; nginx forwards API and docs calls to the api service.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # Cache headers use `expires`, not `add_header`: an add_header inside a location
  # would silently drop the security headers declared above.

  # Hashed build assets never change, so cache them hard.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Client-side app: unknown paths fall back to index.html.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
